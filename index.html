<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Door Check-In</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
  :root{
    --bg:#0B0B10;
    --surface:#15151F;
    --surface-raised:#1D1D2A;
    --border:#2A2A38;
    --text:#F2F1F5;
    --muted:#8C8C9C;
    --violet:#7C5CFC;
    --violet-dim:#4B3A9E;
    --green:#33D17A;
    --green-dim:#123322;
    --red:#FF4D63;
    --red-dim:#3A1420;
    --amber:#FFB648;
    --mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:radial-gradient(circle at 50% -10%, #1A1626 0%, #0B0B10 55%);
    color:var(--text);
    font-family:var(--sans);
    min-height:100vh;
    -webkit-tap-highlight-color: transparent;
  }
  .wrap{
    max-width:520px;
    margin:0 auto;
    padding:20px 16px 48px;
  }
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:18px;
  }
  .brand{
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .brand .eyebrow{
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--violet);
    font-weight:700;
  }
  .brand h1{
    font-size:20px;
    margin:0;
    font-weight:800;
    letter-spacing:-0.01em;
  }
  .count-pill{
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    line-height:1.1;
  }
  .count-pill .num{
    font-family:var(--mono);
    font-size:22px;
    font-weight:700;
  }
  .count-pill .label{
    font-size:10px;
    color:var(--muted);
    letter-spacing:0.08em;
    text-transform:uppercase;
  }
  .progress-track{
    height:5px;
    border-radius:3px;
    background:var(--surface-raised);
    overflow:hidden;
    margin-bottom:18px;
  }
  .progress-fill{
    height:100%;
    background:linear-gradient(90deg, var(--violet), #B084FF);
    width:0%;
    transition:width 0.4s ease;
  }
  .scan-frame{
    position:relative;
    border-radius:20px;
    overflow:hidden;
    background:var(--surface);
    border:1px solid var(--border);
    aspect-ratio:1/1;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  #reader{
    width:100% !important;
    height:100% !important;
  }
  #reader video{
    object-fit:cover;
    width:100% !important;
    height:100% !important;
  }
  #reader img{ display:none !important; }
  .scan-corner-hint{
    position:absolute;
    inset:0;
    pointer-events:none;
    border-radius:20px;
    box-shadow: inset 0 0 0 2px rgba(124,92,252,0.35);
  }
  .cam-off{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:12px;
    color:var(--muted);
    padding:20px;
    text-align:center;
  }
  .cam-off button, .primary-btn{
    background:var(--violet);
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:12px;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
  }
  .cam-off button:active, .primary-btn:active{ transform:scale(0.98); }

  .result-banner{
    margin-top:16px;
    border-radius:16px;
    padding:16px 18px;
    display:flex;
    align-items:center;
    gap:14px;
    min-height:76px;
    border:1px solid var(--border);
    background:var(--surface);
    transition:background 0.2s ease, border-color 0.2s ease;
  }
  .result-banner.idle .r-title{ color:var(--muted); font-weight:600; }
  .result-banner.ok{ background:var(--green-dim); border-color:rgba(51,209,122,0.4); }
  .result-banner.fail{ background:var(--red-dim); border-color:rgba(255,77,99,0.4); }
  .result-icon{
    width:44px;height:44px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:22px;
    flex-shrink:0;
    background:var(--surface-raised);
  }
  .result-banner.ok .result-icon{ background:var(--green); color:#08210F; }
  .result-banner.fail .result-icon{ background:var(--red); color:#2A0810; }
  .r-body{ flex:1; min-width:0; }
  .r-title{ font-weight:800; font-size:16px; margin-bottom:2px; }
  .r-sub{ font-size:12.5px; color:var(--muted); }
  .result-banner.ok .r-sub{ color:#9AE8BE; }
  .result-banner.fail .r-sub{ color:#FFB3BE; }

  .manual-toggle{
    margin-top:14px;
    display:flex;
    gap:8px;
  }
  .manual-toggle input{
    flex:1;
    background:var(--surface);
    border:1px solid var(--border);
    color:var(--text);
    padding:12px 14px;
    border-radius:12px;
    font-family:var(--mono);
    font-size:14px;
    letter-spacing:0.05em;
    text-transform:uppercase;
  }
  .manual-toggle input:focus{ outline:2px solid var(--violet); }
  .manual-toggle button{
    background:var(--surface-raised);
    border:1px solid var(--border);
    color:var(--text);
    padding:0 18px;
    border-radius:12px;
    font-weight:700;
    cursor:pointer;
  }

  .tabs{
    display:flex;
    gap:6px;
    margin-top:26px;
    margin-bottom:12px;
    border-bottom:1px solid var(--border);
  }
  .tab{
    background:none;
    border:none;
    color:var(--muted);
    font-weight:700;
    font-size:13px;
    padding:8px 4px 10px;
    cursor:pointer;
    border-bottom:2px solid transparent;
    margin-right:14px;
  }
  .tab.active{ color:var(--text); border-color:var(--violet); }

  .panel{ display:none; }
  .panel.active{ display:block; }

  .log-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:11px 4px;
    border-bottom:1px solid var(--border);
  }
  .log-item:last-child{ border-bottom:none; }
  .log-name{ font-weight:700; font-size:14px; }
  .log-meta{ font-size:11.5px; color:var(--muted); margin-top:1px; }
  .log-time{
    font-family:var(--mono);
    font-size:12px;
    color:var(--violet);
    white-space:nowrap;
  }
  .empty-state{
    text-align:center;
    color:var(--muted);
    padding:36px 12px;
    font-size:13.5px;
  }

  .flag-item .log-name{ color:var(--red); }
  .flag-item .log-time{ color:var(--red); }

  .search-box{
    width:100%;
    background:var(--surface);
    border:1px solid var(--border);
    color:var(--text);
    padding:10px 14px;
    border-radius:12px;
    font-size:13.5px;
    margin-bottom:10px;
  }
  .search-box:focus{ outline:2px solid var(--violet); }

  .export-row{
    display:flex;
    gap:10px;
    margin-top:18px;
  }
  .export-row button{
    flex:1;
    padding:12px;
    border-radius:12px;
    font-weight:700;
    font-size:13px;
    cursor:pointer;
    border:1px solid var(--border);
    background:var(--surface-raised);
    color:var(--text);
  }
  .export-row button.primary{
    background:var(--violet);
    border:none;
  }
  .footnote{
    text-align:center;
    color:var(--muted);
    font-size:11px;
    margin-top:22px;
    letter-spacing:0.02em;
  }
  ::-webkit-scrollbar{ width:0; height:0; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <span class="eyebrow">Door Check-In</span>
      <h1>Event Entry Scanner</h1>
    </div>
    <div class="count-pill">
      <span class="num" id="countNum">0/63</span>
      <span class="label">checked in</span>
    </div>
  </header>

  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>

  <div class="scan-frame">
    <div id="reader"></div>
    <div class="scan-corner-hint"></div>
  </div>

  <div class="result-banner idle" id="resultBanner">
    <div class="result-icon" id="resultIcon">◎</div>
    <div class="r-body">
      <div class="r-title" id="resultTitle">Point the camera at a QR code</div>
      <div class="r-sub" id="resultSub">Entries are checked against the guest list automatically</div>
    </div>
  </div>

  <div class="manual-toggle">
    <input type="text" id="manualInput" placeholder="Or type code manually (e.g. A2875B6A)" maxlength="12" />
    <button id="manualBtn">Check</button>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="log">Checked in</button>
    <button class="tab" data-tab="flags">Flags</button>
    <button class="tab" data-tab="pending">Not arrived</button>
  </div>

  <div class="panel active" id="panel-log">
    <div id="logList"></div>
  </div>

  <div class="panel" id="panel-flags">
    <div id="flagList"></div>
  </div>

  <div class="panel" id="panel-pending">
    <input class="search-box" id="pendingSearch" placeholder="Search remaining guests..." />
    <div id="pendingList"></div>
  </div>

  <div class="export-row">
    <button class="primary" id="exportBtn">Export check-ins (CSV)</button>
    <button id="resetBtn">Reset event</button>
  </div>

  <div class="footnote">Data syncs live across every device running this scanner for this event.</div>
</div>

const byCode = {};
PARTICIPANTS.forEach(p => { byCode[p.code.toUpperCase()] = p; });

const TOTAL = PARTICIPANTS.length;
document.getElementById('countNum').textContent = `0/${TOTAL}`;

let checkins = {}; // code -> {name, course, alias, time}
let flags = [];    // {code, reason, time}

const STORE_PREFIX = 'checkin:';
const FLAG_KEY = 'flags-log';

async function loadState(){
  try{
    const res = await window.storage.list(STORE_PREFIX, true);
    if(res && res.keys && res.keys.length){
      for(const k of res.keys){
        try{
          const item = await window.storage.get(k, true);
          if(item && item.value){
            const code = k.slice(STORE_PREFIX.length);
            checkins[code] = JSON.parse(item.value);
          }
        }catch(e){}
      }
    }
  }catch(e){}
  try{
    const f = await window.storage.get(FLAG_KEY, true);
    if(f && f.value){ flags = JSON.parse(f.value); }
  }catch(e){}
  renderAll();
}

async function saveCheckin(code, record){
  checkins[code] = record;
  try{ await window.storage.set(STORE_PREFIX + code, JSON.stringify(record), true); }catch(e){}
}

async function saveFlags(){
  try{ await window.storage.set(FLAG_KEY, JSON.stringify(flags), true); }catch(e){}
}

function fmtTime(ts){
  const d = new Date(ts);
  return d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', second:'2-digit'});
}

function renderAll(){
  const count = Object.keys(checkins).length;
  document.getElementById('countNum').textContent = `${count}/${TOTAL}`;
  document.getElementById('progressFill').style.width = `${(count/TOTAL*100).toFixed(1)}%`;

  // Checked-in log, most recent first
  const logList = document.getElementById('logList');
  const entries = Object.entries(checkins).sort((a,b)=> b[1].time - a[1].time);
  if(entries.length === 0){
    logList.innerHTML = `<div class="empty-state">No entries yet — start scanning</div>`;
  } else {
    logList.innerHTML = entries.map(([code, r]) => `
      <div class="log-item">
        <div>
          <div class="log-name">${escapeHtml(r.name)}</div>
          <div class="log-meta">${escapeHtml(r.course || '')}${r.alias ? ' · "'+escapeHtml(r.alias)+'"' : ''} · ${code}</div>
        </div>
        <div class="log-time">${fmtTime(r.time)}</div>
      </div>
    `).join('');
  }

  // Flags
  const flagList = document.getElementById('flagList');
  if(flags.length === 0){
    flagList.innerHTML = `<div class="empty-state">No suspicious scans yet</div>`;
  } else {
    flagList.innerHTML = flags.slice().reverse().map(f => `
      <div class="log-item flag-item">
        <div>
          <div class="log-name">${escapeHtml(f.reason)}</div>
          <div class="log-meta">Code scanned: ${escapeHtml(f.code)}</div>
        </div>
        <div class="log-time">${fmtTime(f.time)}</div>
      </div>
    `).join('');
  }

  renderPending();
}

function renderPending(filter){
  const pendingList = document.getElementById('pendingList');
  const q = (filter || '').trim().toLowerCase();
  const remaining = PARTICIPANTS.filter(p => !checkins[p.code.toUpperCase()])
    .filter(p => !q || p.name.toLowerCase().includes(q) || (p.alias||'').toLowerCase().includes(q));
  if(remaining.length === 0){
    pendingList.innerHTML = `<div class="empty-state">${q ? 'No matches' : 'Everyone has checked in 🎉'}</div>`;
  } else {
    pendingList.innerHTML = remaining.map(p => `
      <div class="log-item">
        <div>
          <div class="log-name">${escapeHtml(p.name)}</div>
          <div class="log-meta">${escapeHtml(p.course || '')}${p.alias ? ' · "'+escapeHtml(p.alias)+'"' : ''}</div>
        </div>
        <div class="log-time">${p.code}</div>
      </div>
    `).join('');
  }
}

function escapeHtml(s){
  return String(s || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

async function handleCode(raw){
  const code = String(raw || '').trim().toUpperCase();
  if(!code) return;
  const banner = document.getElementById('resultBanner');
  const icon = document.getElementById('resultIcon');
  const title = document.getElementById('resultTitle');
  const sub = document.getElementById('resultSub');

  const person = byCode[code];

  if(!person){
    banner.className = 'result-banner fail';
    icon.textContent = '✕';
    title.textContent = 'Invalid code — not on the list';
    sub.textContent = `Scanned: ${code}`;
    flags.push({code, reason:'Unregistered / invalid code scanned', time: Date.now()});
    await saveFlags();
    renderAll();
    return;
  }

  if(checkins[code]){
    banner.className = 'result-banner fail';
    icon.textContent = '⚠';
    title.textContent = `${person.name} — already checked in`;
    sub.textContent = `First entry at ${fmtTime(checkins[code].time)}. Possible duplicate/scam scan.`;
    flags.push({code, reason:`Duplicate scan attempt: ${person.name}`, time: Date.now()});
    await saveFlags();
    renderAll();
    return;
  }

  banner.className = 'result-banner ok';
  icon.textContent = '✓';
  title.textContent = `Welcome, ${person.name}`;
  sub.textContent = `${person.course || ''}${person.alias ? ' · "'+person.alias+'"' : ''} — entry granted`;

  await saveCheckin(code, {
    name: person.name,
    course: person.course,
    alias: person.alias,
    time: Date.now()
  });
  renderAll();
}

// Tabs
document.querySelectorAll('.tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
  });
});

document.getElementById('pendingSearch').addEventListener('input', (e) => renderPending(e.target.value));

// Manual entry
document.getElementById('manualBtn').addEventListener('click', () => {
  const input = document.getElementById('manualInput');
  handleCode(input.value);
  input.value = '';
});
document.getElementById('manualInput').addEventListener('keydown', (e) => {
  if(e.key === 'Enter'){ document.getElementById('manualBtn').click(); }
});

// Export CSV
document.getElementById('exportBtn').addEventListener('click', () => {
  let csv = 'name,course,alias,code,time\n';
  Object.entries(checkins).sort((a,b)=>a[1].time-b[1].time).forEach(([code, r]) => {
    const row = [r.name, r.course||'', r.alias||'', code, new Date(r.time).toISOString()]
      .map(v => `"${String(v).replace(/"/g,'""')}"`).join(',');
    csv += row + '\n';
  });
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'checkin-log.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
});

// Reset
document.getElementById('resetBtn').addEventListener('click', async () => {
  if(!confirm('Clear ALL check-in data for everyone? This cannot be undone.')) return;
  for(const code of Object.keys(checkins)){
    try{ await window.storage.delete(STORE_PREFIX + code, true); }catch(e){}
  }
  checkins = {};
  flags = [];
  await saveFlags();
  renderAll();
});

// Camera scanner
let scannerRunning = false;
function startScanner(){
  const readerEl = document.getElementById('reader');
  const html5QrCode = new Html5Qrcode('reader');
  let lastScan = 0;
  html5QrCode.start(
    { facingMode: 'environment' },
    { fps: 10, qrbox: { width: 240, height: 240 } },
    (decodedText) => {
      const now = Date.now();
      if(now - lastScan < 1500) return; // debounce rapid repeat frames
      lastScan = now;
      handleCode(decodedText);
    },
    (errorMessage) => { /* ignore per-frame scan misses */ }
  ).then(() => { scannerRunning = true; })
  .catch((err) => {
    readerEl.innerHTML = `
      <div class="cam-off">
        <div>Couldn't access the camera.<br/>Check permissions, or use manual entry below.</div>
        <button id="retryCam">Try again</button>
      </div>`;
    document.getElementById('retryCam').addEventListener('click', startScanner);
  });
}

loadState();
startScanner();
</script>
</body>
</html>
