<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Door Check-In</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --bg:#0B0B10;
    --surface:#15151F;
    --surface-raised:#1D1D2A;
    --border:#2A2A38;
    --text:#F2F1F5;
    --muted:#8C8C9C;
    --violet:#7C5CFC;
    --violet-dim:#4B3A9E;
    --green:#33D17A;
    --green-dim:#123322;
    --red:#FF4D63;
    --red-dim:#3A1420;
    --amber:#FFB648;
    --mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:radial-gradient(circle at 50% -10%, #1A1626 0%, #0B0B10 55%);
    color:var(--text);
    font-family:var(--sans);
    min-height:100vh;
    -webkit-tap-highlight-color: transparent;
  }
  .wrap{
    max-width:520px;
    margin:0 auto;
    padding:20px 16px 48px;
  }
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:18px;
  }
  .brand{
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .brand .eyebrow{
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--violet);
    font-weight:700;
  }
  .brand h1{
    font-size:20px;
    margin:0;
    font-weight:800;
    letter-spacing:-0.01em;
  }
  .count-pill{
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    line-height:1.1;
  }
  .count-pill .num{
    font-family:var(--mono);
    font-size:22px;
    font-weight:700;
  }
  .count-pill .label{
    font-size:10px;
    color:var(--muted);
    letter-spacing:0.08em;
    text-transform:uppercase;
  }
  .progress-track{
    height:5px;
    border-radius:3px;
    background:var(--surface-raised);
    overflow:hidden;
    margin-bottom:18px;
  }
  .progress-fill{
    height:100%;
    background:linear-gradient(90deg, var(--violet), #B084FF);
    width:0%;
    transition:width 0.4s ease;
  }
  .scan-frame{
    position:relative;
    border-radius:20px;
    overflow:hidden;
    background:var(--surface);
    border:1px solid var(--border);
    aspect-ratio:1/1;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  #reader{
    width:100% !important;
    height:100% !important;
  }
  #reader video{
    object-fit:cover;
    width:100% !important;
    height:100% !important;
  }
  #reader img{ display:none !important; }
  .scan-corner-hint{
    position:absolute;
    inset:0;
    pointer-events:none;
    border-radius:20px;
    box-shadow: inset 0 0 0 2px rgba(124,92,252,0.35);
  }
  .cam-off{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:12px;
    color:var(--muted);
    padding:20px;
    text-align:center;
  }
  .cam-off button, .primary-btn{
    background:var(--violet);
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:12px;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
  }
  .cam-off button:active, .primary-btn:active{ transform:scale(0.98); }

  .result-banner{
    margin-top:16px;
    border-radius:16px;
    padding:16px 18px;
    display:flex;
    align-items:center;
    gap:14px;
    min-height:76px;
    border:1px solid var(--border);
    background:var(--surface);
    transition:background 0.2s ease, border-color 0.2s ease;
  }
  .result-banner.idle .r-title{ color:var(--muted); font-weight:600; }
  .result-banner.ok{ background:var(--green-dim); border-color:rgba(51,209,122,0.4); }
  .result-banner.fail{ background:var(--red-dim); border-color:rgba(255,77,99,0.4); }
  .result-icon{
    width:44px;height:44px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:22px;
    flex-shrink:0;
    background:var(--surface-raised);
  }
  .result-banner.ok .result-icon{ background:var(--green); color:#08210F; }
  .result-banner.fail .result-icon{ background:var(--red); color:#2A0810; }
  .r-body{ flex:1; min-width:0; }
  .r-title{ font-weight:800; font-size:16px; margin-bottom:2px; }
  .r-sub{ font-size:12.5px; color:var(--muted); }
  .result-banner.ok .r-sub{ color:#9AE8BE; }
  .result-banner.fail .r-sub{ color:#FFB3BE; }

  .warn-banner{
    margin-bottom:14px;
    border-radius:14px;
    padding:14px 16px;
    background:var(--red-dim);
    border:1px solid rgba(255,77,99,0.4);
    font-size:13px;
    line-height:1.5;
  }
  .warn-banner strong{ color:#FFB3BE; display:block; margin-bottom:4px; font-size:13.5px; }
  .warn-banner a{ color:var(--amber); font-weight:700; text-decoration:underline; }
  .warn-banner .copy-link-row{
    display:flex;
    gap:8px;
    margin-top:10px;
  }
  .warn-banner .copy-link-row input{
    flex:1;
    background:var(--surface);
    border:1px solid var(--border);
    color:var(--text);
    padding:8px 10px;
    border-radius:10px;
    font-size:11.5px;
    font-family:var(--mono);
  }
  .warn-banner .copy-link-row button{
    background:var(--surface-raised);
    border:1px solid var(--border);
    color:var(--text);
    padding:0 14px;
    border-radius:10px;
    font-weight:700;
    font-size:12px;
    cursor:pointer;
  }

  .manual-toggle{
    margin-top:14px;
    display:flex;
    gap:8px;
  }
  .manual-toggle input{
    flex:1;
    background:var(--surface);
    border:1px solid var(--border);
    color:var(--text);
    padding:12px 14px;
    border-radius:12px;
    font-family:var(--mono);
    font-size:14px;
    letter-spacing:0.05em;
    text-transform:uppercase;
  }
  .manual-toggle input:focus{ outline:2px solid var(--violet); }
  .manual-toggle button{
    background:var(--surface-raised);
    border:1px solid var(--border);
    color:var(--text);
    padding:0 18px;
    border-radius:12px;
    font-weight:700;
    cursor:pointer;
  }

  .tabs{
    display:flex;
    gap:6px;
    margin-top:26px;
    margin-bottom:12px;
    border-bottom:1px solid var(--border);
  }
  .tab{
    background:none;
    border:none;
    color:var(--muted);
    font-weight:700;
    font-size:13px;
    padding:8px 4px 10px;
    cursor:pointer;
    border-bottom:2px solid transparent;
    margin-right:14px;
  }
  .tab.active{ color:var(--text); border-color:var(--violet); }

  .panel{ display:none; }
  .panel.active{ display:block; }

  .log-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:11px 4px;
    border-bottom:1px solid var(--border);
  }
  .log-item:last-child{ border-bottom:none; }
  .log-name{ font-weight:700; font-size:14px; }
  .log-meta{ font-size:11.5px; color:var(--muted); margin-top:1px; }
  .log-time{
    font-family:var(--mono);
    font-size:12px;
    color:var(--violet);
    white-space:nowrap;
  }
  .empty-state{
    text-align:center;
    color:var(--muted);
    padding:36px 12px;
    font-size:13.5px;
  }

  .flag-item .log-name{ color:var(--red); }
  .flag-item .log-time{ color:var(--red); }

  .search-box{
    width:100%;
    background:var(--surface);
    border:1px solid var(--border);
    color:var(--text);
    padding:10px 14px;
    border-radius:12px;
    font-size:13.5px;
    margin-bottom:10px;
  }
  .search-box:focus{ outline:2px solid var(--violet); }

  .export-row{
    display:flex;
    gap:10px;
    margin-top:18px;
  }
  .export-row button{
    flex:1;
    padding:12px;
    border-radius:12px;
    font-weight:700;
    font-size:13px;
    cursor:pointer;
    border:1px solid var(--border);
    background:var(--surface-raised);
    color:var(--text);
  }
  .export-row button.primary{
    background:var(--violet);
    border:none;
  }
  .footnote{
    text-align:center;
    color:var(--muted);
    font-size:11px;
    margin-top:22px;
    letter-spacing:0.02em;
  }
  ::-webkit-scrollbar{ width:0; height:0; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <span class="eyebrow">Door Check-In</span>
      <h1>Event Entry Scanner</h1>
    </div>
    <div class="count-pill">
      <span class="num" id="countNum">0/1</span>
      <span class="label">checked in</span>
    </div>
  </header>

  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>

  <div id="browserWarning" style="display:none;"></div>

  <div class="scan-frame">
    <div id="reader"></div>
    <div class="scan-corner-hint"></div>
  </div>

  <div class="result-banner idle" id="resultBanner">
    <div class="result-icon" id="resultIcon">◎</div>
    <div class="r-body">
      <div class="r-title" id="resultTitle">Point the camera at a QR code</div>
      <div class="r-sub" id="resultSub">Entries are checked against the guest list automatically</div>
    </div>
  </div>

  <div class="manual-toggle">
    <input type="text" id="manualInput" placeholder="Or type pass ID manually (e.g. RMP-4622-FFBE)" maxlength="16" />
    <button id="manualBtn">Check</button>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="log">Checked in</button>
    <button class="tab" data-tab="flags">Flags</button>
    <button class="tab" data-tab="pending">Not arrived</button>
    <button class="tab" data-tab="add">+ Add guest</button>
  </div>

  <div class="panel active" id="panel-log">
    <div id="logList"></div>
  </div>

  <div class="panel" id="panel-flags">
    <div id="flagList"></div>
  </div>

  <div class="panel" id="panel-pending">
    <input class="search-box" id="pendingSearch" placeholder="Search remaining guests..." />
    <div id="pendingList"></div>
  </div>

  <div class="panel" id="panel-add">
    <div class="add-form">
      <input class="search-box" id="newName" placeholder="Full name (required)" />
      <input class="search-box" id="newPassType" placeholder="Pass type (e.g. FRESHER, VIP)" />
      <input class="search-box" id="newPhone" placeholder="Phone number" />
      <input class="search-box" id="newEmail" placeholder="Email" />
      <input class="search-box" id="newPassId" placeholder="Existing pass ID (optional — leave blank to auto-generate)" style="font-family:var(--mono); text-transform:uppercase;" />
      <button class="primary-btn" id="addGuestBtn" style="width:100%;margin-top:4px;">Add guest &amp; generate QR</button>
    </div>
    <div id="newGuestResult" style="display:none; margin-top:18px; text-align:center;">
      <div class="r-title" style="margin-bottom:10px;" id="newGuestName"></div>
      <div id="qrCanvasHolder" style="display:inline-block; background:#fff; padding:14px; border-radius:14px;"></div>
      <div class="log-meta" style="margin:10px 0;">Code: <span id="newGuestCode" style="font-family:var(--mono); color:var(--text);"></span></div>
      <button class="primary-btn" id="downloadQrBtn">Download QR</button>
    </div>
  </div>

  <div class="export-row">
    <button class="primary" id="exportBtn">Export check-ins (CSV)</button>
    <button id="resetBtn">Reset event</button>
  </div>

  <div class="footnote">Data is saved on this device only. Use the same phone/browser for the whole event, and export the CSV regularly as a backup.</div>
</div>

<script>
// Local, single-device storage (this app runs as its own hosted site,
// so we use localStorage rather than Claude's artifact-only storage API).
const LS_KEY = 'door_checkin_app_v1';
const storage = {
  _read(){
    try{ return JSON.parse(localStorage.getItem(LS_KEY) || '{}'); }catch(e){ return {}; }
  },
  _write(data){
    localStorage.setItem(LS_KEY, JSON.stringify(data));
  },
  async get(key){
    const data = this._read();
    if(!(key in data)) throw new Error('not found');
    return { key, value: data[key] };
  },
  async set(key, value){
    const data = this._read();
    data[key] = value;
    this._write(data);
    return { key, value };
  },
  async delete(key){
    const data = this._read();
    delete data[key];
    this._write(data);
    return { key, deleted: true };
  },
  async list(prefix){
    const data = this._read();
    const keys = Object.keys(data).filter(k => !prefix || k.startsWith(prefix));
    return { keys, prefix };
  }
};

const BASE_PARTICIPANTS = [{"name": "VARUN DEV DIKHIT", "passType": "FRESHER", "phone": "9569272751", "email": "varundevdikhit@gmail.com", "passId": "4622FFBE"}];
let ALL_PARTICIPANTS = BASE_PARTICIPANTS.slice();

const byCode = {};
function rebuildIndex(){
  for(const k of Object.keys(byCode)) delete byCode[k];
  ALL_PARTICIPANTS.forEach(p => { byCode[normalizeCode(p.passId)] = p; });
}
rebuildIndex();

let checkins = {}; // passId -> {name, passType, phone, email, time}
let flags = [];    // {code, reason, time}

const STORE_PREFIX = 'checkin:';
const GUEST_PREFIX = 'guest:';
const FLAG_KEY = 'flags-log';

async function loadGuests(){
  try{
    const res = await storage.list(GUEST_PREFIX);
    if(res && res.keys && res.keys.length){
      for(const k of res.keys){
        try{
          const item = await storage.get(k);
          if(item && item.value){
            const g = JSON.parse(item.value);
            if(!byCode[normalizeCode(g.passId)]){
              ALL_PARTICIPANTS.push(g);
            }
          }
        }catch(e){}
      }
      rebuildIndex();
    }
  }catch(e){}
}

async function loadState(){
  try{
    const res = await storage.list(STORE_PREFIX);
    if(res && res.keys && res.keys.length){
      for(const k of res.keys){
        try{
          const item = await storage.get(k);
          if(item && item.value){
            const code = k.slice(STORE_PREFIX.length);
            checkins[code] = JSON.parse(item.value);
          }
        }catch(e){}
      }
    }
  }catch(e){}
  try{
    const f = await storage.get(FLAG_KEY);
    if(f && f.value){ flags = JSON.parse(f.value); }
  }catch(e){}
  renderAll();
}

async function saveCheckin(code, record){
  checkins[code] = record;
  try{ await storage.set(STORE_PREFIX + code, JSON.stringify(record)); }catch(e){}
}

async function saveFlags(){
  try{ await storage.set(FLAG_KEY, JSON.stringify(flags)); }catch(e){}
}

function fmtTime(ts){
  const d = new Date(ts);
  return d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', second:'2-digit'});
}

function renderAll(){
  const total = ALL_PARTICIPANTS.length;
  const count = Object.keys(checkins).length;
  document.getElementById('countNum').textContent = `${count}/${total}`;
  document.getElementById('progressFill').style.width = `${(count/total*100).toFixed(1)}%`;

  // Checked-in log, most recent first
  const logList = document.getElementById('logList');
  const entries = Object.entries(checkins).sort((a,b)=> b[1].time - a[1].time);
  if(entries.length === 0){
    logList.innerHTML = `<div class="empty-state">No entries yet — start scanning</div>`;
  } else {
    logList.innerHTML = entries.map(([code, r]) => `
      <div class="log-item">
        <div>
          <div class="log-name">${escapeHtml(r.name)}</div>
          <div class="log-meta">${escapeHtml(r.passType || '')}${r.email ? ' · '+escapeHtml(r.email) : ''} · ${code}</div>
        </div>
        <div class="log-time">${fmtTime(r.time)}</div>
      </div>
    `).join('');
  }

  // Flags
  const flagList = document.getElementById('flagList');
  if(flags.length === 0){
    flagList.innerHTML = `<div class="empty-state">No suspicious scans yet</div>`;
  } else {
    flagList.innerHTML = flags.slice().reverse().map(f => `
      <div class="log-item flag-item">
        <div>
          <div class="log-name">${escapeHtml(f.reason)}</div>
          <div class="log-meta">Code scanned: ${escapeHtml(f.code)}</div>
        </div>
        <div class="log-time">${fmtTime(f.time)}</div>
      </div>
    `).join('');
  }

  renderPending();
}

function renderPending(filter){
  const pendingList = document.getElementById('pendingList');
  const q = (filter || '').trim().toLowerCase();
  const remaining = ALL_PARTICIPANTS.filter(p => !checkins[p.passId.toUpperCase()])
    .filter(p => !q || p.name.toLowerCase().includes(q) || (p.email||'').toLowerCase().includes(q));
  if(remaining.length === 0){
    pendingList.innerHTML = `<div class="empty-state">${q ? 'No matches' : 'Everyone has checked in 🎉'}</div>`;
  } else {
    pendingList.innerHTML = remaining.map(p => `
      <div class="log-item">
        <div>
          <div class="log-name">${escapeHtml(p.name)}</div>
          <div class="log-meta">${escapeHtml(p.passType || '')}${p.email ? ' · '+escapeHtml(p.email) : ''}</div>
        </div>
        <div class="log-time">${p.passId}</div>
      </div>
    `).join('');
  }
}

function escapeHtml(s){
  return String(s || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

// Normalizes a pass ID for matching: strips dashes/spaces/punctuation,
// uppercases, and drops a leading "RMP" prefix if present — so
// "RMP-4622-FFBE", "4622FFBE", and "rmp 4622 ffbe" all match.
function normalizeCode(s){
  let v = String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if(v.startsWith('RMP')) v = v.slice(3);
  return v;
}

async function handleCode(raw){
  const rawText = String(raw || '').trim();
  if(!rawText) return;

  // QR codes generated by the Entry Pass Generator contain the full
  // participant data as JSON. Older/plain-code QR codes are still supported.
  let qrData = null;
  try {
    const parsed = JSON.parse(rawText);
    if(parsed && parsed.type === 'RAMPAGE_ENTRY_PASS' && parsed.code){
      qrData = parsed;
    }
  } catch(e) {}

  const code = normalizeCode(qrData ? qrData.code : rawText);
  if(!code) return;
  const banner = document.getElementById('resultBanner');
  const icon = document.getElementById('resultIcon');
  const title = document.getElementById('resultTitle');
  const sub = document.getElementById('resultSub');

  // Prefer the locally registered participant record. If the QR contains
  // a valid Entry Pass payload but the code is not in the local list, use
  // the participant data embedded in the QR and add it to this scanner's list.
  let person = byCode[code];
  if(!person && qrData){
    person = {
      name: String(qrData.name || 'Guest').trim(),
      passId: code,
      passType: qrData.passType || '',
      phone: qrData.phone || '',
      email: qrData.email || ''
    };
    ALL_PARTICIPANTS.push(person);
    rebuildIndex();
  }

  if(!person){
    banner.className = 'result-banner fail';
    icon.textContent = '✕';
    title.textContent = 'Invalid QR / code';
    sub.textContent = `Scanned: ${code}`;
    flags.push({code, reason:'Unregistered / invalid code scanned', time: Date.now()});
    await saveFlags();
    renderAll();
    return;
  }

  if(checkins[code]){
    banner.className = 'result-banner fail';
    icon.textContent = '⚠';
    title.textContent = `${person.name} — already checked in`;
    sub.textContent = `First entry at ${fmtTime(checkins[code].time)}. Possible duplicate/scam scan.`;
    flags.push({code, reason:`Duplicate scan attempt: ${person.name}`, time: Date.now()});
    await saveFlags();
    renderAll();
    return;
  }

  banner.className = 'result-banner ok';
  icon.textContent = '✓';
  title.textContent = `Welcome, ${person.name}`;
  sub.textContent = `${person.passType || ''}${person.email ? ' · '+person.email : ''} — entry granted`;

  await saveCheckin(code, {
    name: person.name,
    passType: person.passType,
    phone: person.phone,
    email: person.email,
    time: Date.now()
  });
  renderAll();
}

// Tabs
document.querySelectorAll('.tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
  });
});

document.getElementById('pendingSearch').addEventListener('input', (e) => renderPending(e.target.value));

// Manual entry
document.getElementById('manualBtn').addEventListener('click', () => {
  const input = document.getElementById('manualInput');
  handleCode(input.value);
  input.value = '';
});
document.getElementById('manualInput').addEventListener('keydown', (e) => {
  if(e.key === 'Enter'){ document.getElementById('manualBtn').click(); }
});

// Export CSV
document.getElementById('exportBtn').addEventListener('click', () => {
  let csv = 'name,passType,phone,email,passId,time\n';
  Object.entries(checkins).sort((a,b)=>a[1].time-b[1].time).forEach(([code, r]) => {
    const row = [r.name, r.passType||'', r.phone||'', r.email||'', code, new Date(r.time).toISOString()]
      .map(v => `"${String(v).replace(/"/g,'""')}"`).join(',');
    csv += row + '\n';
  });
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'checkin-log.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
});

// Reset
document.getElementById('resetBtn').addEventListener('click', async () => {
  if(!confirm('Clear ALL check-in data AND any guests added on this device (restoring the original list)? This cannot be undone.')) return;
  for(const code of Object.keys(checkins)){
    try{ await storage.delete(STORE_PREFIX + code); }catch(e){}
  }
  try{
    const res = await storage.list(GUEST_PREFIX);
    if(res && res.keys && res.keys.length){
      for(const k of res.keys){
        try{ await storage.delete(k); }catch(e){}
      }
    }
  }catch(e){}
  checkins = {};
  flags = [];
  ALL_PARTICIPANTS = BASE_PARTICIPANTS.slice();
  rebuildIndex();
  await saveFlags();
  renderAll();
});

// Add guest
function genCode(){
  const chars = '0123456789ABCDEF';
  const block = () => Array.from({length:4}, () => chars[Math.floor(Math.random()*chars.length)]).join('');
  let code;
  do{
    code = `RMP-${block()}-${block()}`;
  } while(byCode[normalizeCode(code)]);
  return code;
}

let lastQrCanvas = null;

document.getElementById('addGuestBtn').addEventListener('click', async () => {
  const name = document.getElementById('newName').value.trim();
  const passType = document.getElementById('newPassType').value.trim();
  const phone = document.getElementById('newPhone').value.trim();
  const email = document.getElementById('newEmail').value.trim();
  const manualCode = document.getElementById('newPassId').value.trim().toUpperCase();
  if(!name){ alert('Name is required.'); return; }

  let code;
  if(manualCode){
    if(byCode[normalizeCode(manualCode)]){
      alert(`Pass ID ${manualCode} is already assigned to ${byCode[normalizeCode(manualCode)].name}. Use a different pass ID, or leave the field blank to auto-generate one.`);
      return;
    }
    code = manualCode;
  } else {
    code = genCode();
  }

  const guest = { name, passType, phone, email, passId: code };

  try{
    await storage.set(GUEST_PREFIX + code, JSON.stringify(guest));
  }catch(e){
    alert('Could not save guest — please try again.');
    return;
  }

  ALL_PARTICIPANTS.push(guest);
  rebuildIndex();
  renderAll();

  document.getElementById('newName').value = '';
  document.getElementById('newPassType').value = '';
  document.getElementById('newPhone').value = '';
  document.getElementById('newEmail').value = '';
  document.getElementById('newPassId').value = '';

  document.getElementById('newGuestResult').style.display = 'block';
  document.getElementById('newGuestName').textContent = name;
  document.getElementById('newGuestCode').textContent = code;

  const holder = document.getElementById('qrCanvasHolder');
  holder.innerHTML = '';
  const qrPayload = JSON.stringify({
    type: "RAMPAGE_ENTRY_PASS",
    version: 1,
    name,
    code,
    passType,
    phone,
    email,
    event: "The Fresher Night — Lucknow University"
  });
  new QRCode(holder, { text: qrPayload, width: 180, height: 180, correctLevel: QRCode.CorrectLevel.M });
  setTimeout(() => { lastQrCanvas = holder.querySelector('canvas'); }, 50);
});

document.getElementById('downloadQrBtn').addEventListener('click', () => {
  const canvas = document.getElementById('qrCanvasHolder').querySelector('canvas');
  if(!canvas) return;
  const name = document.getElementById('newGuestName').textContent.replace(/[^a-z0-9]/gi,'_');
  const a = document.createElement('a');
  a.href = canvas.toDataURL('image/png');
  a.download = `qr-${name}.png`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
});

// Camera scanner
let scannerRunning = false;

function detectInAppBrowser(){
  const ua = navigator.userAgent || '';
  // Common in-app webviews that block or cripple camera (getUserMedia) access.
  if(/\bFBAN|\bFBAV|Instagram|Line\/|MicroMessenger|Snapchat/i.test(ua)) return 'generic';
  if(/\bwv\b/.test(ua) && /Version\/[\d.]+.*Chrome/i.test(ua)) return 'generic'; // Android WebView signature
  // WhatsApp's own in-app browser doesn't always add a distinct UA token,
  // so we also flag any Android WebView-style UA missing a real browser suffix.
  if(/Android/i.test(ua) && !/Chrome\/|Firefox\/|SamsungBrowser\//i.test(ua)) return 'generic';
  return null;
}

function showBrowserWarning(html){
  const el = document.getElementById('browserWarning');
  el.innerHTML = html;
  el.style.display = 'block';
}

function buildOpenInBrowserBanner(){
  const url = window.location.href;
  return `
    <div class="warn-banner">
      <strong>⚠ Camera may be blocked in this app</strong>
      This page looks like it's open inside an app's built-in browser (e.g. WhatsApp, Instagram), which often blocks camera access entirely. Please open this link in Chrome or Safari instead — tap the "···" or share icon at the top/bottom of this screen and choose <b>Open in Browser</b>.
      <div class="copy-link-row">
        <input type="text" readonly value="${escapeHtml(url)}" id="warnUrlInput" />
        <button id="warnCopyBtn">Copy link</button>
      </div>
    </div>`;
}

function startScanner(){
  const readerEl = document.getElementById('reader');

  // 0. This page cannot access the camera at all when opened as a local
  // file (file:// — e.g. double-clicked from Downloads, or a file:/// URL
  // in the address bar). Browsers block camera access on file:// pages
  // with no visible error, which is why the box just stays blank forever.
  if(window.location.protocol === 'file:'){
    readerEl.innerHTML = `
      <div class="cam-off">
        <div><b>Can't use the camera from a local file.</b><br/>This page needs to be hosted (e.g. uploaded to a web host, or run through a local server) so it loads as http:// or https:// — then the camera will work.<br/><br/>Manual entry below still works right now.</div>
      </div>`;
    return;
  }

  // 1. Camera requires a secure context (HTTPS or localhost).
  if(!window.isSecureContext){
    readerEl.innerHTML = `
      <div class="cam-off">
        <div>Camera access needs a secure (https://) connection.<br/>Please open this page over HTTPS, or use manual entry below.</div>
      </div>`;
    return;
  }

  // 2. The scanning library must have actually loaded (CDN can be blocked
  // by some networks/in-app browsers, or by content blockers).
  if(typeof Html5Qrcode === 'undefined'){
    readerEl.innerHTML = `
      <div class="cam-off">
        <div>The scanner couldn't load (a required script was blocked).<br/>Try opening this page in Chrome or Safari, or use manual entry below.</div>
        <button id="retryCam">Try again</button>
      </div>`;
    document.getElementById('retryCam').addEventListener('click', startScanner);
    return;
  }

  // 3. Warn early if we're likely inside an in-app browser known to
  // restrict camera access, before even attempting to start it.
  if(detectInAppBrowser()){
    showBrowserWarning(buildOpenInBrowserBanner());
    const copyBtn = document.getElementById('warnCopyBtn');
    if(copyBtn){
      copyBtn.addEventListener('click', () => {
        const input = document.getElementById('warnUrlInput');
        input.select();
        try{ document.execCommand('copy'); }catch(e){}
        if(navigator.clipboard){ navigator.clipboard.writeText(input.value).catch(()=>{}); }
        copyBtn.textContent = 'Copied!';
        setTimeout(() => { copyBtn.textContent = 'Copy link'; }, 1500);
      });
    }
  }

  const html5QrCode = new Html5Qrcode('reader');
  let lastScan = 0;

  const onSuccess = (decodedText) => {
    const now = Date.now();
    if(now - lastScan < 1500) return; // debounce rapid repeat frames
    lastScan = now;
    handleCode(decodedText);
  };
  const onScanFailure = () => { /* ignore per-frame scan misses */ };

  const showCamError = (err) => {
    const name = (err && err.name) ? err.name : '';
    let msg = "Couldn't access the camera.";
    if(name === 'NotAllowedError' || /Permission/i.test(String(err))){
      msg = 'Camera permission was denied. Check your browser/site settings and allow camera access, then retry.';
    } else if(name === 'NotFoundError' || /no camera/i.test(String(err))){
      msg = 'No camera was found on this device.';
    } else if(name === 'NotReadableError'){
      msg = 'The camera is already in use by another app. Close other apps using the camera and retry.';
    } else if(detectInAppBrowser()){
      msg = "Camera access is blocked in this in-app browser. Open this page in Chrome or Safari instead.";
    }
    readerEl.innerHTML = `
      <div class="cam-off">
        <div>${msg}<br/>You can also use manual entry below.</div>
        <button id="retryCam">Try again</button>
      </div>`;
    document.getElementById('retryCam').addEventListener('click', startScanner);
  };

  // Prefer the back camera; fall back to any available camera if the
  // environment-facing constraint isn't supported on this device/browser.
  let settled = false;
  const watchdog = setTimeout(() => {
    if(!settled){
      settled = true;
      showCamError(new Error('Camera did not respond in time.'));
    }
  }, 8000);

  html5QrCode.start(
    { facingMode: 'environment' },
    { fps: 10, qrbox: { width: 240, height: 240 } },
    onSuccess,
    onScanFailure
  ).then(() => {
    settled = true;
    clearTimeout(watchdog);
    scannerRunning = true;
  })
  .catch((err) => {
    Html5Qrcode.getCameras().then(devices => {
      if(devices && devices.length){
        html5QrCode.start(
          devices[0].id,
          { fps: 10, qrbox: { width: 240, height: 240 } },
          onSuccess,
          onScanFailure
        ).then(() => {
          settled = true;
          clearTimeout(watchdog);
          scannerRunning = true;
        })
        .catch((e2) => {
          if(!settled){ settled = true; clearTimeout(watchdog); showCamError(e2); }
        });
      } else {
        if(!settled){ settled = true; clearTimeout(watchdog); showCamError(err); }
      }
    }).catch(() => {
      if(!settled){ settled = true; clearTimeout(watchdog); showCamError(err); }
    });
  });
}

(async () => {
  await loadGuests();
  await loadState();
  startScanner();
})();
</script>
